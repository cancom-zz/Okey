<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Okey</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#062a1c;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#13774f,#0d5a3c 40%,#062a1c 100%)}
  main{text-align:center;padding:24px;max-width:420px}
  .tile{display:inline-grid;place-items:center;width:70px;height:104px;border-radius:12px;background:linear-gradient(160deg,#fffdf4,#f1e7cc 60%,#e0d2ae);box-shadow:inset 0 2px 0 #fff,0 3px 0 #b8a578,0 10px 20px rgba(0,0,0,.45);font:700 54px/1 Georgia,serif;color:#1f5fbf;margin:0 4px 18px;transform:rotate(-6deg)}
  .tile+.tile{transform:rotate(5deg);color:#c62828}
  h1{font:italic 400 30px/1.15 Georgia,serif;color:#f1d48a;margin:0 0 8px}
  p{color:#cfe0d6;line-height:1.5;margin:0 0 20px}
  a{display:inline-block;padding:13px 26px;border-radius:14px;background:linear-gradient(#f1d48a,#c79b3c);color:#2a1d00;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main>
  <div><span class="tile">4</span><span class="tile">4</span></div>
  <h1>Bu taş masada yok</h1>
  <p>Aradığın sayfa bulunamadı. Link eski ya da hatalı olabilir.<br><small>Page not found. The link may be old or mistyped.</small></p>
  <a href="/">Okey'e dön · Back to Okey</a>
</main>
</body>
</html>
