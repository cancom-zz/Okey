<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Okey · Klasik Türk okeyi, arkadaşlarla ya da botlara karşı</title>
<meta name="description" content="Klasik 106 taşlı Türk okeyi tarayıcıda: arkadaşlarınla bir link ile ya da dürüst botlara karşı oyna. Giriş yok, reklam yok, ödeme yok.">
<meta name="theme-color" content="#0b3d29">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Okey">
<meta property="og:description" content="Klasik Türk okeyi: arkadaşlarla ya da botlara karşı. Giriş yok, reklam yok.">
<link rel="stylesheet" href="css/okey.css">
<link rel="modulepreload" href="js/app.js">
</head>
<body data-felt="green" data-screen="home">
<div id="app">
  <header class="top">
    <button class="ibtn back" id="tBack" hidden data-i18n-aria="top.back">‹</button>
    <button class="brand" id="brand">Okey</button>
    <span class="tcode" id="tCode" hidden></span>
    <span class="netstat" id="netstat" hidden></span>
    <nav class="icons">
      <button class="ibtn" id="tTip" data-i18n-aria="tip.title">☕</button>
      <button class="ibtn" id="tRules" data-i18n-aria="rules.title">?</button>
      <button class="ibtn" id="tStats" data-i18n-aria="stats.title">📊</button>
      <button class="ibtn" id="tSound" data-i18n-aria="top.mute">🔊</button>
      <button class="ibtn" id="tSet" data-i18n-aria="settings.title">⚙️</button>
    </nav>
  </header>
  <main id="screen"></main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal"></div>
<div id="fx" aria-hidden="true"></div>
<noscript><p style="padding:24px;color:#f4f1e8">Okey için JavaScript gerekli. · Okey needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
