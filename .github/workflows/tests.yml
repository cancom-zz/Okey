name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Engines, bots, host (incl. no-leak security test)
        run: npm test
      - name: Worker bundles
        run: npx wrangler deploy --dry-run --outdir /tmp/okey-dryrun
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Layout + practice end to end (Playwright)
        run: node test/layout.pw.mjs
      - name: Online end to end against wrangler dev (Playwright)
        run: node test/online.pw.mjs
